; Stackfall firmware - M5StickS3 (ESP32-S3, 8 MB flash / 8 MB octal PSRAM).
; WHY -DARDUINO_USB_CDC_ON_BOOT=1 IS LOAD-BEARING, DO NOT REMOVE TO CLEAN UP:
; this board definition already sets ARDUINO_USB_MODE=1, so without the CDC flag
; Serial is bound to UART0 and nothing whatsoever appears on the native USB port.
; Every device task in this ledger concludes from serial output, so dropping that
; one flag turns every later spike into a false negative - a silent monitor that
; looks exactly like dead firmware.
;
; Both environments below repeat every key literally so the two stanzas stay
; diffable line by line; neither one derives from the other.
; No PMIC unit library is added: the PMIC IRQ/GPIO path is on the cut list and
; M5Unified already exposes everything this game needs from the PMIC.

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_filter = +<*> -<probe/>
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  m5stack/M5Unified@0.2.19
  m5stack/M5GFX@0.2.28
extra_scripts =
  pre:tools/pio_build_info.py
  post:tools/check_image.py

; Round-1 probe record, kept untouched so the previous build stays reproducible.
[env:probe]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_filter = +<probe/> +<hal/sticks3/audio.cpp> +<hal/sticks3/buttons.cpp> +<hal/sticks3/clock.cpp> +<hal/sticks3/imu.cpp> +<hal/sticks3/panel.cpp> +<hal/sticks3/panel_hud.cpp> +<hal/sticks3/power.cpp> +<hal/sticks3/sysinfo.cpp> +<stackfall/power/policy.cpp>
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -DSF_PROBE=6
lib_deps =
  m5stack/M5Unified@0.2.19
  m5stack/M5GFX@0.2.28
extra_scripts = pre:tools/pio_build_info.py

; NOTE: the round-2 S3b probe environment (formerly [env:probe5]) was removed
; when SPIKE S4 took over the probe number. The S3b round-2 source files under
; src/probe/ remain as the historical record of the closed tilt spike.
